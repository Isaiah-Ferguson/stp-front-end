# Frontend CI (#7). There was previously no automated check on this repo at all, so type
# regressions and build breaks only surfaced on someone's laptop.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Advisory until the half-finished React Query migration is cleaned up: nine
        # react-hooks/set-state-in-effect errors remain in pages that still fetch with
        # useEffect + setState. Drop continue-on-error once those are resolved so lint
        # becomes a real gate.
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
